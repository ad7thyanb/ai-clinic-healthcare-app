<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Vite HMR is disabled in AI Studio cloud preview environment.
      // Intercept and handle WebSocket connection rejections from @vite/client to prevent unhandled error alerts.
      (function () {
        if (typeof window === 'undefined') return;
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          var stack = (reason && reason.stack) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            stack.indexOf('@vite/client') !== -1 ||
            stack.indexOf('createWebSocketModuleRunnerTransport') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function (event) {
          var msg = (event && (event.message || String(event))) || '';
          var filename = (event && event.filename) || '';
          var stack = (event && event.error && event.error.stack) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            filename.indexOf('@vite/client') !== -1 ||
            stack.indexOf('@vite/client') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <title>AI Clinic &amp; Healthcare Management</title>
    <meta name="description" content="Healthcare management and AI clinic analytics system powered by clinical database records." />
    <meta property="og:title" content="AI Clinic &amp; Healthcare Management" />
    <meta property="og:description" content="Healthcare management and AI clinic analytics system powered by clinical database records." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
